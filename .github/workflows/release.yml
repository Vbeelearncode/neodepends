name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build for ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-latest
            platform: macos-arm64

    steps:
      # 1. Get the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Rust toolchain
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # 3. Cache Rust dependencies
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 4. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 5. Build Rust release
      - name: Build Rust binary
        run: cargo build --release --locked

      - name: Create release package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          # Get version tag and platform info
          TAG="${GITHUB_REF_NAME}"
          HOST="$(rustc -vV | awk '/^host: /{print $2}')"
          PKG_NAME="neodepends"

          BUNDLE_DIR="dist/${PKG_NAME}-${TAG}-${HOST}"
          mkdir -p "${BUNDLE_DIR}"

          cp "target/release/neodepends" "${BUNDLE_DIR}/neodepends"
          chmod +x "${BUNDLE_DIR}/neodepends"
          cp artifacts/depends.jar "${BUNDLE_DIR}/depends.jar"

          cp README.md "${BUNDLE_DIR}/README.md"
          cp LICENSE "${BUNDLE_DIR}/" 2>/dev/null || true

          tar -C dist -czf "dist/${PKG_NAME}-${TAG}-${HOST}.tar.gz" "${PKG_NAME}-${TAG}-${HOST}"

      - name: Create release package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Get version tag and platform info
          $tag = $env:GITHUB_REF_NAME
          $platform = (rustc -vV | Select-String '^host: ' | ForEach-Object { $_.ToString().Split(' ')[1] })
          $pkgName = "neodepends"

          $bundleDir = "dist/$pkgName-$tag-$platform"
          New-Item -ItemType Directory -Force -Path $bundleDir | Out-Null

          Copy-Item "target/release/neodepends.exe" "$bundleDir/neodepends.exe"
          Copy-Item "artifacts/depends.jar" "$bundleDir/depends.jar"

          if (Test-Path "README.md") { Copy-Item "README.md" "$bundleDir/README.md" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$bundleDir/LICENSE" }

          Compress-Archive -Force -Path $bundleDir -DestinationPath "dist/$pkgName-$tag-$platform.zip"

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
